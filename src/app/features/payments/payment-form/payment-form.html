<form class="payment-form" (ngSubmit)="submitForm()">
  <div class="grid two">
    <label>
      <span>Facture (invoiceId)</span>
      <input type="text" formControlName="invoiceId" placeholder="ID de la facture" />
    </label>
    <label>
      <span>Montant</span>
      <input type="number" step="0.01" formControlName="amount" placeholder="Montant" />
    </label>
  </div>

  <div class="grid two">
    <label>
      <span>Date de paiement</span>
      <input type="date" formControlName="paymentDate" />
    </label>
    <label>
      <span>Mode de paiement</span>
      <select formControlName="paymentMethod">
        <option value="cash">Espèces</option>
        <option value="check">Chèque</option>
        <option value="bank_transfer">Virement</option>
        <option value="credit_card">Carte bancaire</option>
      </select>
    </label>
  </div>

  <label>
    <span>Référence</span>
    <input type="text" formControlName="reference" placeholder="Référence de paiement" />
  </label>

  <label>
    <span>Notes</span>
    <textarea rows="4" formControlName="notes" placeholder="Commentaire optionnel"></textarea>
  </label>

  <div class="actions">
    <button type="button" class="ghost" (click)="cancel.emit()">Annuler</button>
    <button type="submit" [disabled]="disabled()">{{ submitLabel() }}</button>
  </div>
</form>
